
name: Frozen Forecast Collector

on:
  workflow_dispatch:
  schedule:
    # EARLY: 9 AM EST / 10 AM EDT
    - cron: "0 14 * * *"

    # FINAL PREGAME: every 15 minutes, UTC afternoon/evening
    - cron: "*/15 17-23 * * *"

    # FINAL PREGAME: every 15 minutes, UTC overnight
    - cron: "*/15 0-6 * * *"

permissions:
  contents: read

concurrency:
  group: frozen-forecast-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save EARLY pregame predictions
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect_predictions.py --mode early --write

      - name: Save FINAL PREGAME predictions
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 14 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect_predictions.py --mode final --write


