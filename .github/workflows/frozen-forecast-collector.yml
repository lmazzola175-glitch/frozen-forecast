
name: Frozen Forecast Collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which snapshot to collect"
        required: true
        default: "early"
        type: choice
        options:
          - early
          - final

      operation:
        description: "Dry run or save predictions"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

      model:
        description: "Which model to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - v1
          - v2

  schedule:
    # EARLY: 9 AM EDT
    - cron: "0 13 * * *"

    # EARLY: 9 AM EST
    - cron: "0 14 * * *"

    # FINAL PREGAME: every 15 minutes
    - cron: "*/15 17-23 * * *"
    - cron: "*/15 0-6 * * *"

permissions:
  contents: read

concurrency:
  group: frozen-forecast-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine collection settings
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            echo "operation=$INPUT_OPERATION" >> "$GITHUB_OUTPUT"
            echo "model=$INPUT_MODEL" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "0 13 * * *" ] || \
               [ "$SCHEDULE" = "0 14 * * *" ]; then

            # Only collect EARLY at 9 AM New York time.
            CURRENT_HOUR=$(TZ=America/New_York date +%H)

            if [ "$CURRENT_HOUR" = "09" ]; then
              echo "mode=early" >> "$GITHUB_OUTPUT"
              echo "operation=write" >> "$GITHUB_OUTPUT"
              echo "model=all" >> "$GITHUB_OUTPUT"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            fi

          else
            echo "mode=final" >> "$GITHUB_OUTPUT"
            echo "operation=write" >> "$GITHUB_OUTPUT"
            echo "model=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Show collection settings
        run: |
          echo "Mode: ${{ steps.settings.outputs.mode }}"
          echo "Operation: ${{ steps.settings.outputs.operation }}"
          echo "Model: ${{ steps.settings.outputs.model }}"

      - name: Run Frozen Forecast collector
        if: steps.settings.outputs.mode != 'skip'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COLLECTION_MODE: ${{ steps.settings.outputs.mode }}
          COLLECTION_OPERATION: ${{ steps.settings.outputs.operation }}
          COLLECTION_MODEL: ${{ steps.settings.outputs.model }}
        shell: bash
        run: |
          ARGS=(--mode "$COLLECTION_MODE" --model "$COLLECTION_MODEL")

          if [ "$COLLECTION_OPERATION" = "write" ]; then
            ARGS+=(--write)
          fi

          python collect_predictions.py "${ARGS[@]}"

      - name: Collection complete
        if: success()
        run: echo "Frozen Forecast collector finished successfully."

