
name: Test Frozen Forecast V3 Controlled Write

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection window'
        required: true
        type: choice
        default: early
        options:
          - early
          - final

      operation:
        description: 'Choose how predictions are collected'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - one-write
          - full-batch

permissions:
  contents: read

concurrency:
  group: frozen-forecast-v3-collector
  cancel-in-progress: false

jobs:
  v3-controlled-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile collect_v3_experiments_scheduled.py
          python -m py_compile engine_v3.py
          python -m py_compile engine_v3_fatigue_experiment.py
          python -m py_compile engine_v3_totals_experiment.py

      - name: Show collection settings
        env:
          COLLECTION_MODE: ${{ inputs.mode }}
          COLLECTION_OPERATION: ${{ inputs.operation }}
        run: |
          echo "Collection window: $COLLECTION_MODE"
          echo "Operation: $COLLECTION_OPERATION"

      - name: Test V3 snapshot collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COLLECTION_MODE: ${{ inputs.mode }}
          COLLECTION_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          ARGS=(--mode "$COLLECTION_MODE")

          case "$COLLECTION_OPERATION" in
            dry-run)
              ARGS+=(--max-inserts 1)
              ;;

            one-write)
              ARGS+=(--write --max-inserts 1)
              ;;

            full-batch)
              ARGS+=(--write --all-eligible)
              ;;

            *)
              echo "Invalid collection operation"
              exit 1
              ;;
          esac

          python collect_v3_experiments_scheduled.py "${ARGS[@]}"

      - name: Collection complete
        if: success()
        run: echo "V3 controlled collection test completed successfully."


