
name: Test Frozen Forecast V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect NHL game-level statistics
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from engine import get_json, season_for, STATS

          today = datetime.now(
              ZoneInfo("America/New_York")
          ).date().isoformat()

          season = season_for(today)

          print("=" * 60)
          print("FROZEN FORECAST V2 — NHL API DIAGNOSTIC")
          print("=" * 60)

          print("DATE:", today)
          print("SEASON:", season)

          params = {
              "isAggregate": "false",
              "isGame": "true",
              "cayenneExp": (
                  f"gameTypeId=2 and seasonId={season}"
              ),
              "limit": 10,
          }

          data = get_json(
              f"{STATS}/team/summary",
              params,
          )

          rows = data.get("data", [])

          print("ROWS RETURNED:", len(rows))
          print("TOTAL RECORDS:", data.get("total"))

          if rows:
              print("\nAVAILABLE FIELDS:")
              print("-" * 60)

              for key in sorted(rows[0]):
                  print(f"{key}: {rows[0][key]}")

              print("-" * 60)

              required_fields = [
                  "teamFullName",
                  "gameDate",
                  "gameId",
                  "shotsFor",
                  "shotsAgainst",
                  "goalsFor",
              ]

              print("\nFIELD VALIDATION:")

              for field in required_fields:
                  status = (
                      "FOUND"
                      if field in rows[0]
                      else "MISSING"
                  )
                  print(f"{field}: {status}")

          else:
              print("\nWARNING: No game-level rows returned.")
              print("RESPONSE KEYS:", list(data.keys()))

          print("\nDIAGNOSTIC COMPLETE")
          PY

