
name: Test Frozen Forecast V1 and V2 Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test EARLY predictions (dry run)
        run: python collect_predictions.py --mode early --model all

      - name: Test FINAL PREGAME predictions (dry run)
        run: python collect_predictions.py --mode final --model all

