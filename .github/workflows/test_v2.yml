
name: Test Frozen Forecast V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test V2 recent-form projections
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from engine_v2 import (
              build_projections,
              fetch_recent_team_stats,
          )
          from engine import season_for

          today = datetime.now(
              ZoneInfo("America/New_York")
          ).date().isoformat()

          print("=" * 60)
          print("FROZEN FORECAST V2 — PROJECTION TEST")
          print("=" * 60)

          recent = fetch_recent_team_stats(
              season_for(today),
              today,
          )

          print("DATE:", today)
          print("RECENT TEAMS FOUND:", len(recent))

          for team in ["BOS", "NYR", "TOR", "COL"]:
              print(team, recent.get(team))

          assert len(recent) >= 28, (
              "Too few teams with recent-game statistics"
          )

          df, meta = build_projections(
              today,
              verify=True,
          )

          print("\nMODEL:", meta["model_version"])
          print("SCHEDULED:", meta["scheduled"])
          print("PROJECTED:", meta["projected"])
          print("RECENT TEAMS:", meta["recent_team_count"])
          print("SKIPPED:", meta["skipped"])

          if not df.empty:
              print("\nV2 PROJECTIONS:")
              print(
                  df[
                      [
                          "Away Code",
                          "Home Code",
                          "Projected Total",
                          "Goalie Reliability",
                      ]
                  ].to_string(index=False)
              )

              assert df["Projected Total"].between(
                  0, 15
              ).all(), "Invalid goal projection detected"

          print("\nV2 TEST COMPLETE")
          PY

