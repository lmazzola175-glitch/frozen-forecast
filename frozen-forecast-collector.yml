name: Frozen Forecast - Test Pregame Collector

on:
  workflow_dispatch:
    inputs:
      write_predictions:
        description: 'Save new EARLY predictions to Supabase? Leave false for first test.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pregame collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WRITE_PREDICTIONS: ${{ inputs.write_predictions }}
        shell: bash
        run: |
          if [ "$WRITE_PREDICTIONS" = "true" ]; then
            python collect_predictions.py --write
          else
            python collect_predictions.py
          fi
